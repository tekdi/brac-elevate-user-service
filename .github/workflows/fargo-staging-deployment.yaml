name: Staging Fargo Deployment
on:
  workflow_run:
    workflows:
      - Build & Push Multi-Arch Docker Image
    branches:
      - develop
    types:
      - completed
permissions:
  contents: read
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.FARGO_EC2_HOST }}
          username: ${{ secrets.HOST_NAME_DEV }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.TARGET_DIR_FARGO }}
            ./deploy.sh
