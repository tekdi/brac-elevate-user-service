name: Build & Push Multi-Arch Docker Image
on:
  push:
    branches:
      - develop
  # workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug GitHub Context
        run: |
          echo "Actor      : ${{ github.actor }}"
          echo "Repository : ${{ github.repository }}"
          echo "Owner      : ${{ github.repository_owner }}"
          echo "Ref        : ${{ github.ref }}"
          echo "Ref Name   : ${{ github.ref_name }}"

      - name: Verify GITHUB_TOKEN
        run: |
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "✅ GITHUB_TOKEN is available."
          else
            echo "❌ GITHUB_TOKEN is NOT available."
            exit 1
          fi

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=develop-latest,enable=true
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build & Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Published Manifest
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Cleanup old GHCR package versions (safe, multi-arch aware)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: ${{ github.event.repository.name }}
          # Never touch anything currently referenced by a tag
          keep-n-tagged: 3
          # Remove only dangling/untagged manifests older than the above,
          # and correctly resolves multi-arch index -> child manifest
          # references so an active tag's platform images are never deleted.
          delete-untagged: true
          dry-run: false
